<!doctype html>
<html lang="id" data-app-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasjo · Kasir Agen Hausjo</title>
<meta name="description" content="Kasjo: pembukuan agen BRILink dan Mini ATM. Catat transaksi, fee otomatis, saldo kas dan bank, kasbon, tutup kasir.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e7c73">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Roboto:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: mobile-banking look — white top bar, teal gradient balance card, white icon tiles with soft shadow, flat white bottom nav with a round teal "Catat" key; sheets slide up. */
:root{
  --bg:#f4f8f7; --surface:#ffffff; --surface-2:#f1f6f5; --ink:#1d2a29; --muted:#6b7b79; --line:#e1e9e8;
  --brand:#0e7c73; --brand-2:#14a093; --brand-ink:#ffffff; --brand-soft:#e3f3f1;
  --accent:#f6a833; --accent-ink:#2b1a00;
  --good:#0e9b8b; --bad:#e0483e; --warn:#c77a12; --good-soft:#e0f4f1; --bad-soft:#fdeceb; --warn-soft:#fef3e1;
  --paper:#ffffff; --paper-ink:#2b2b2b; --shadow:0 2px 8px rgb(14 60 56 / .10);
  --f-display:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-body:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --logo-ink:#0b5654; --logo-orange:#f6822a;
  --r:14px; color-scheme:light;
}
:root[data-app-theme="dark"]{
  --logo-ink:#e8f2f0; --logo-orange:#f8953f;
  --bg:#0c1615; --surface:#14211f; --surface-2:#101b1a; --ink:#e5efed; --muted:#93a6a3; --line:#253634;
  --brand:#139a8e; --brand-2:#1cb5a6; --brand-ink:#ffffff; --brand-soft:#173230;
  --accent:#f8b54b; --accent-ink:#2b1a00;
  --good:#35c3b2; --bad:#f2786f; --warn:#e8a64a; --good-soft:#143330; --bad-soft:#3a1d1b; --warn-soft:#352a14;
  --paper:#1b2a28; --paper-ink:#e5efed; --shadow:0 2px 8px rgb(0 0 0 / .35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.mark{display:flex;align-items:center;gap:8px;font-family:"Poppins",var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.02em;color:var(--logo-ink)}
.mark .logo{width:32px;height:32px;flex:none;display:block}
.onb .mark .logo,.loading .mark .logo{width:40px;height:40px}
.mark b{color:var(--logo-orange);font-weight:700}
.thm{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--brand);display:grid;place-items:center}
.thm svg{width:20px;height:20px}
.modebtn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:52px;height:46px;padding:0 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--brand);font-size:10.5px;font-weight:700;line-height:1.1}
.modebtn svg{width:20px;height:20px}
.modebtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.biz{margin-left:auto;text-align:right;min-width:0}
.biz .n{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.biz .d{color:var(--muted);font-size:12px}
.local{background:var(--warn-soft);color:var(--warn);font-size:12.5px;text-align:center;padding:6px 12px}

main{padding-block:16px calc(110px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:17px;margin:4px 0 0;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
h2.sec .more{margin-left:auto;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--brand);background:none;border:0;padding:4px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero */
.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);box-shadow:0 6px 18px rgb(14 124 115 / .25);color:var(--brand-ink);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;bottom:-90px;width:240px;height:200px;border-radius:50%;background:color-mix(in srgb,var(--brand-ink) 8%,transparent)}
.hero .lbl{color:color-mix(in srgb,var(--brand-ink) 75%,transparent)}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;letter-spacing:-.01em}
.hero .row{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:color-mix(in srgb,var(--brand-ink) 85%,transparent)}
.hero .row b{color:var(--brand-ink);font-weight:700}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qk{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--ink)}
.qk .tile{width:60px;height:56px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.qk .tile::after{content:"";position:absolute;right:13px;bottom:12px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.qk svg{width:26px;height:26px;color:var(--brand)}

/* card / list */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 3px rgb(14 60 56 / .05)}
.rows{display:flex;flex-direction:column}
.r{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-width:0}
.r:first-child{border-top:0}
.r .main{flex:1;min-width:0}
.r .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .v{text-align:right;font-weight:700;white-space:nowrap}
.r .v .s{text-align:right;font-weight:500}
button.r{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left}
button.r:first-child{border-top:0}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;letter-spacing:.02em}
.ic.out{background:var(--bad-soft);color:var(--bad)}
.ic.in{background:var(--brand-soft);color:var(--brand)}
.ic.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ic.bad{background:var(--bad-soft);color:var(--bad)}
.pos{color:var(--good)} .neg{color:var(--bad)}

.bal-kas{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.bal-kas .amt{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neu{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.chart{padding:12px 10px 6px}
.chart svg{display:block;width:100%;height:auto}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* form */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:13px;font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-width:0}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.money{position:relative}
.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.money .inp{padding-left:44px;font-variant-numeric:tabular-nums;font-weight:700}
.money.xl .inp{font-family:var(--f-display);font-size:30px;padding-block:14px}
.money.xl span{font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.chip.acc[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.nom{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nom button{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 4px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.hint{font-size:12.5px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:600;font-size:13px;padding:0}
details.more summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--brand);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px}

.effect{background:var(--surface-2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.effect .e{display:flex;justify-content:space-between;gap:10px}
.effect .warnline{color:var(--bad);font-weight:600;font-size:12.5px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:15px}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.acc{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:clamp(16px,4.6vw,20px);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.main{grid-column:1/-1;background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:var(--brand-ink)}
.stat.main .v{font-size:30px;color:var(--brand-ink)}
.stat.main .lbl,.stat.main .muted{color:color-mix(in srgb,var(--brand-ink) 82%,transparent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;border-top:0}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding-block:6px 6px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--brand)}
.nav a.fab{color:var(--brand)}
.nav a.fab .k{width:58px;height:58px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin-top:-30px;border:4px solid var(--surface);box-shadow:0 6px 16px rgb(14 124 115 / .35)}
.nav a.fab .k svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(5 12 10 / .5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.anim{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.anim{animation:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sh-head h3{font-family:var(--f-display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.sh-head .x{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;font-size:18px;line-height:1}

/* receipt */
.paper{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:12.5px;line-height:1.55;width:100%;max-width:300px;margin:0 auto;padding:16px 16px 18px;border-radius:4px;box-shadow:0 1px 0 var(--line),0 8px 20px rgb(0 0 0 / .08);white-space:pre-wrap;word-break:break-word;position:relative;
  mask:radial-gradient(circle 5px at 50% 100%,transparent 4.5px,#000 5px) 0 100%/12px 10px repeat-x,linear-gradient(#000,#000) 0 0/100% calc(100% - 9px) no-repeat;
  -webkit-mask:radial-gradient(circle 5px at 50% 100%,transparent 4.5px,#000 5px) 0 100%/12px 10px repeat-x,linear-gradient(#000,#000) 0 0/100% calc(100% - 9px) no-repeat}

.denoms{display:flex;flex-direction:column;gap:8px}
.dn{display:grid;grid-template-columns:96px 1fr 110px;gap:10px;align-items:center}
.dn .inp{padding:9px 12px;text-align:center}
.dn .sub{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
.dn .face{font-weight:700;font-variant-numeric:tabular-nums}
.verdict{border-radius:14px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.warn{background:var(--warn-soft);color:var(--warn)}
.verdict .big{font-family:var(--f-display);font-weight:700;font-size:22px}

.tier{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;align-items:center}
.tier .x{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:42px}
.poster-prev{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;place-items:center;min-height:200px}
.poster-prev img{width:100%;max-width:320px;height:auto;border-radius:4px;box-shadow:var(--shadow);display:block;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.onb{padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.onb h1{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.onb h1 b{color:var(--brand)}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--bad);font-weight:600;font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:360px){.pgrid{grid-template-columns:repeat(2,1fr)}}
.ptile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:0 1px 3px rgb(14 60 56 / .05)}
.ptile .n{font-weight:600;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.ptile .p{font-weight:700;color:var(--brand);font-size:14px;font-variant-numeric:tabular-nums}
.ptile .st{font-size:11px;font-weight:700;color:var(--muted)}
.ptile .st.low{color:var(--warn)}.ptile .st.out{color:var(--bad)}
.ptile.add{border-style:dashed;align-items:center;justify-content:center;color:var(--brand);font-weight:700;font-size:13px;text-align:center}
.ptile[data-n]{position:relative}.ptile[data-n]::after{content:attr(data-n);position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.qty button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:16px;line-height:1}
.qty b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.total-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.total-row .big{font-family:var(--f-display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanbox::after{content:"";position:absolute;left:12%;right:12%;top:45%;height:2px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.searchrow{display:flex;gap:8px}.searchrow .inp{flex:1}
.qris-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.qris-card img{display:block;width:100%;max-width:340px;max-height:52vh;object-fit:contain;border-radius:8px}
.qris-card .amt{font-family:var(--f-display);font-weight:700;font-size:28px;color:#10241f;font-variant-numeric:tabular-nums}
.qris-card .ask{font-size:13px;color:#5a6c66;text-align:center}
.qris-thumb{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.qris-thumb img{width:64px;height:64px;object-fit:cover;object-position:center 40%;border-radius:8px;background:#fff;border:1px solid var(--line);flex:none}
.subbar{padding-block:10px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;justify-content:space-between}
.subbar.warn{background:var(--warn-soft);color:var(--warn)}.subbar.bad{background:var(--bad-soft);color:var(--bad)}
.subbar .btn{padding:7px 12px;font-size:13px;flex:none}
.plans{display:grid;grid-template-columns:1fr;gap:10px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.plan .main{flex:1;min-width:0}.plan .nm{font-weight:700;font-size:16px}.plan .pr{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--brand);font-variant-numeric:tabular-nums}
.plan.best{border-color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand) 25%,transparent)}
.bill-amt{font-family:var(--f-display);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums;color:var(--ink)}
.nav a{position:relative}
.nav a .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;line-height:1}
.alert{padding:12px 14px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.alert.warn{border-color:var(--warn);background:var(--warn-soft)}.alert.bad{border-color:var(--bad);background:var(--bad-soft)}
.alert .txt{flex:1;min-width:0;font-size:13.5px}.alert .txt b{display:block;font-size:14px}
.lowbal{color:var(--warn)!important}
.remind{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}.remind:first-child{border-top:0}
.remind .main{flex:1;min-width:0}.remind .btn{padding:8px 12px;font-size:13px;flex:none;text-decoration:none}
.btn.wa{background:#1f9d55;color:#fff}
.pill.sync{border:0;margin-top:3px;font:inherit;font-size:11px;font-weight:700;cursor:pointer}
.auth-err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.tempin{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px;font-weight:600}
.tempin code{font-size:22px;letter-spacing:.12em;color:var(--ink);font-weight:700}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
const APP_VERSION='1.6.1';
/* ---------- helpers ---------- */
const $=(s,el=document)=>el.querySelector(s);
const NF=new Intl.NumberFormat('id-ID');
const fmt=n=>NF.format(Math.round(n||0));
const rp=n=>(n<0?'−':'')+'Rp '+fmt(Math.abs(n||0));
const sgn=n=>(n>0?'+':n<0?'−':'')+'Rp '+fmt(Math.abs(n));
const shortRp=n=>{const a=Math.abs(n);let s;if(a>=1e6)s=(a/1e6).toLocaleString('id-ID',{maximumFractionDigits:1})+'jt';else if(a>=1e3)s=Math.round(a/1e3)+'rb';else s=String(Math.round(a));return(n<0?'−':'')+s};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const startOfDay=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
const BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const HARI=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const HARI_L=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const fDate=ts=>{const d=new Date(ts);return d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear()};
const fTime=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const digits=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- domain ---------- */
const AGENT={
  tarik:{label:'Tarik Tunai',dir:'out',code:'TT'},
  transfer:{label:'Transfer',dir:'in',code:'TF'},
  setor:{label:'Setor Tunai',dir:'in',code:'ST'},
  topup:{label:'Top Up E-Wallet',dir:'in',code:'TU'},
  tagihan:{label:'Bayar Tagihan',dir:'in',code:'BT'}
};
const OTHER={jual:'Penjualan Toko',stok:'Barang Masuk',stokadj:'Penyesuaian Stok',modal:'Modal Masuk',ambil:'Ambil Uang',pindah:'Pindah Saldo',biaya:'Biaya Operasional',kasbon:'Kasbon',bayarkasbon:'Bayar Kasbon',selisih:'Selisih Kas'};
const kindLabel=k=>AGENT[k]?AGENT[k].label:(OTHER[k]||k);
const DEFAULT_FEES={
  tarik:[{upTo:1000000,fee:5000},{upTo:2500000,fee:10000},{upTo:5000000,fee:15000},{upTo:null,fee:20000}],
  transfer:[{upTo:1000000,fee:5000},{upTo:2500000,fee:10000},{upTo:5000000,fee:15000},{upTo:null,fee:20000}],
  setor:[{upTo:1000000,fee:5000},{upTo:2500000,fee:10000},{upTo:5000000,fee:15000},{upTo:null,fee:20000}],
  topup:[{upTo:500000,fee:3000},{upTo:1000000,fee:5000},{upTo:null,fee:10000}],
  tagihan:[{upTo:null,fee:3000}]
};
const BANKS=['BRI','BNI','Mandiri','BCA','BSI','BTN'];
const QUICK=[100000,200000,300000,500000,1000000,2000000];
const DENOMS=[100000,50000,20000,10000,5000,2000,1000,500,200,100];

function feeFor(type,A){
  const tiers=(state.cfg&&state.cfg.fees&&state.cfg.fees[type])||DEFAULT_FEES[type]||[];
  const s=tiers.slice().sort((a,b)=>(a.upTo==null?Infinity:a.upTo)-(b.upTo==null?Infinity:b.upTo));
  for(const t of s){if(t.upTo==null||A<=t.upTo)return t.fee||0}
  return 0;
}
const banks=()=>(state.cfg?state.cfg.accounts.filter(a=>a.kind==='bank'):[]);
// Opened from the Google Play app (Trusted Web Activity): the Play launch URL carries ?src=twa and Chrome sets an
// android-app:// referrer. Kept per session only, because the Play app shares storage with Chrome on the same phone.
// Google Play's Payments policy: no subscription purchase or pointer to one inside the Play app, status only.
const IN_PLAY=(()=>{let f=false;try{f=new URLSearchParams(location.search).get('src')==='twa'||String(document.referrer).startsWith('android-app://')||sessionStorage.getItem('kasjo-twa')==='1';if(f)sessionStorage.setItem('kasjo-twa','1')}catch(e){}return f})();
const MAX_USERS=3;
const tokoInfo=()=>(state.me&&state.me.toko)||{};
const isExpired=()=>tokoInfo().active===false;
// actions that change data: blocked while the subscription has run out (view-only)
const WRITE_ACTS=new Set(['save-trx','pos-save','mut-save','kb-save','pay-save','kb-more','close-save','fee-save','acct-add','acct-add-custom','acct-del','biz-save','prod-save','prod-del','si-save','sa-save','qris-save','qris-del','sup-add','del-trx','onb-save','demo','pm-add','pos-add','stock-in','stock-adj','prod-new','ua-save']);
function subBanner(){
  const t=tokoInfo();if(t.active==null)return'';
  const owner=state.role==='owner';
  const btn=!owner?'':IN_PLAY?'<button class="btn ghost" data-act="sheet" data-s="billing">Lihat</button>':'<button class="btn pri" data-act="sheet" data-s="billing">Perpanjang</button>';
  if(!t.active)return `<div class="subbar bad"><div class="wrap subbar" style="width:100%;padding-block:0"><span>Masa langganan habis. Data hanya bisa dilihat${owner||IN_PLAY?'':', hubungi pemilik toko'}.</span>${btn}</div></div>`;
  if(t.daysLeft<=5)return `<div class="subbar warn"><div class="wrap subbar" style="width:100%;padding-block:0"><span>${t.status==='trial'?'Uji coba gratis':'Langganan'} berakhir ${t.daysLeft<=1?'hari ini':t.daysLeft+' hari lagi'}.</span>${btn}</div></div>`;
  return'';
}
function subLabel(){const t=tokoInfo();if(t.active==null)return'';if(!t.active)return'Habis sejak '+fDate(t.until)+' · hanya lihat data';return (t.status==='trial'?'Uji coba gratis':'Aktif')+' s/d '+fDate(t.until)+' · '+t.daysLeft+' hari lagi'}
// ---- saldo minimum ----
// "saldo BRI", but "Saldo PPOB" stays as named (no "saldo Saldo PPOB")
const saldoOf=n=>/^(saldo|deposit)\b/i.test(n)?n:'saldo '+n;
function lowBalances(bal){bal=bal||balances();return(state.cfg?state.cfg.accounts:[]).filter(a=>a.min>0&&(bal[a.id]||0)<a.min).map(a=>({a,bal:bal[a.id]||0}))}
function warnIfCrossed(before){
  const after=balances(),crossed=(state.cfg?state.cfg.accounts:[]).filter(a=>a.min>0&&(before[a.id]||0)>=a.min&&(after[a.id]||0)<a.min);
  if(crossed.length)setTimeout(()=>toast('Perhatian: '+crossed.map(a=>saldoOf(a.name)+' '+rp(after[a.id]||0)).join(', ')+' di bawah batas minimum'),1200);
}
// ---- pengingat kasbon ----
const DAY=86400000;
function kbDue(){const tomorrow=dayKey(Date.now()+DAY);return state.kasbon.map(k=>Object.assign({k},kasbonStats(k))).filter(x=>x.sisa>0&&x.k.due&&x.k.due<=tomorrow).sort((a,b)=>a.k.due<b.k.due?-1:1)}
function dueWhen(due){const today=dayKey(Date.now());if(due<today){const n=Math.round((new Date(today+'T00:00')-new Date(due+'T00:00'))/DAY);return{cls:'bad',txt:'Lewat '+n+' hari',msg:', sudah lewat jatuh tempo '+fDate(new Date(due+'T00:00'))}}
  if(due===today)return{cls:'warn',txt:'Hari ini',msg:', jatuh tempo hari ini'};return{cls:'neu',txt:'Besok',msg:', jatuh tempo besok ('+fDate(new Date(due+'T00:00'))+')'}}
function waNumber(ph){const d=String(ph||'').replace(/\D/g,'');if(d.length<9)return'';return d.startsWith('0')?'62'+d.slice(1):d.startsWith('8')?'62'+d:d}
function kbWaLink(k,s){const n=waNumber(k.phone);if(!n)return'';const w=k.due?dueWhen(k.due).msg:'';
  return 'https://wa.me/'+n+'?text='+encodeURIComponent(`Halo ${k.name}, ini pengingat dari ${state.cfg.name}. Kasbon Anda masih ${rp(s.sisa)}${w}. Mohon dibayar ya. Terima kasih.`)}
function reminded(){try{return JSON.parse(localStorage.getItem('kasjo-reminded')||'{}')||{}}catch(e){return{}}}
function markReminded(id){const r=reminded();r[id]=dayKey(Date.now());try{localStorage.setItem('kasjo-reminded',JSON.stringify(r))}catch(e){}}
function remindRow(x){const k=x.k,w=dueWhen(k.due),link=kbWaLink(k,x),done=reminded()[k.id]===dayKey(Date.now());
  return `<div class="remind"><span class="ic ${w.cls==='bad'?'bad':'out'}">${esc((k.name||'?').slice(0,2).toUpperCase())}</span><span class="main"><span class="t" style="display:block;font-weight:600">${esc(k.name)} · ${rp(x.sisa)}</span><span style="display:block;margin-top:3px"><span class="pill ${w.cls}">${w.txt}</span>${done?' <span class="pill good">Sudah diingatkan</span>':''}</span></span>
  ${link?`<a class="btn ${done?'ghost':'wa'}" href="${esc(link)}" target="_blank" rel="noopener" data-act="kb-remind" data-id="${esc(k.id)}">${done?'Kirim lagi':'Ingatkan'}</a>`:`<button class="btn ghost" data-act="kbdetail" data-id="${esc(k.id)}">Isi no. WA</button>`}</div>`}
const shopQris=()=>state.qris.find(x=>x.id==='main'&&x.img)||null;
const suppliers=()=>(state.cfg?state.cfg.accounts.filter(a=>a.kind==='supplier'):[]);
const CATS=[['pulsa','Pulsa & data'],['token','Token listrik'],['sembako','Sembako'],['minuman','Makanan & minuman'],['lain','Lainnya']];
const catLabel=c=>(CATS.find(x=>x[0]===c)||[0,'Lainnya'])[1];
function products(){return state.product.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name),'id'))}
// stock is derived from movements, so phones never overwrite each other's counts
function stockMap(){const m={};for(const t of state.trx){if(!t.items||(t.kind!=='jual'&&t.kind!=='stok'&&t.kind!=='stokadj'))continue;const sign=t.kind==='jual'?-1:1;for(const it of t.items){if(it.pid)m[it.pid]=(m[it.pid]||0)+sign*(it.qty||0)}}return m}
function lowStock(sm){sm=sm||stockMap();return products().filter(p=>!p.digital&&(sm[p.id]||0)<=(p.min==null?3:p.min))}
const acctName=id=>{const a=state.cfg&&state.cfg.accounts.find(x=>x.id===id);return a?a.name:id};
function balances(){
  const b={};
  if(state.cfg)for(const a of state.cfg.accounts)b[a.id]=0;
  for(const t of state.trx){const d=t.d||{};for(const k in d)b[k]=(b[k]||0)+(d[k]||0)}
  return b;
}
function agentEffect(f){
  const A=f.amount||0,F=f.fee||0,C=f.cost||0,bank=f.acct;
  const d={kas:0};d[bank]=0;
  if(AGENT[f.type].dir==='out'){d.kas-=A;d[bank]+=A}else{d.kas+=A;d[bank]-=A}
  if(F){if(f.feeTo==='kas')d.kas+=F;else d[bank]+=F}
  if(C)d[bank]-=C;
  return d;
}
function kasbonStats(k){
  let total=0,paid=0;const rows=[];
  for(const t of state.trx){if(t.ref!==k.id)continue;rows.push(t);if(t.kind==='kasbon'||(t.kind==='jual'&&t.pay==='kasbon'))total+=t.amount;else if(t.kind==='bayarkasbon')paid+=t.amount}
  rows.sort((a,b)=>b.ts-a.ts);
  return{total,paid,sisa:total-paid,rows};
}

/* ---------- state ---------- */
const state={phase:'loading',cfg:null,trx:[],kasbon:[],closing:[],product:[],qris:[],slow:false,canWrite:true,token:null,me:null,role:null,supportWa:''};
const ui={
  form:{type:'tarik',acct:null,amount:0,fee:0,feeAuto:true,feeTo:'kas',cost:0,cust:'',note:''},
  sheet:null,lastTrx:null,range:'today',rtype:'all',q:'',
  onb:{name:'',banks:{BRI:true},modal:{},custom:''},
  mut:{kind:'modal',acct:'kas',to:null,amount:0,note:''},
  kb:{name:'',phone:'',amount:0,due:'',note:'',takeCash:true},
  pay:{amount:0,acct:'kas'},addMore:0,
  close:{counts:{},direct:0,mode:'count',note:''},
  fees:null,feeType:'tarik',accts:null,newBank:'',bizName:'',confirm:null,busy:false,
  auth:{mode:'login',phone:'',pin:'',pin2:'',toko:'',name:'',err:''},
  pin:{current:'',next:'',next2:'',err:''},
  users:{list:null,err:'',add:{name:'',phone:'',role:'kasir'},temp:null},audit:null,wipePin:'',
  catMode:'agen',
  pos:{cart:[],q:'',cat:'all',pay:'kas',bank:null,given:0,kbId:'',kbName:'',cust:'',manual:null},
  prod:null,stockF:null,adjF:null,scanFor:null,newSup:'',qrisDraft:{img:null,acct:null,name:''}
};

/* ---------- server sync ---------- */
const API='api/';
const COLS=['trx','kasbon','closing','product','qris'];
const ROLE_LABEL={owner:'Pemilik',manager:'Manajer',kasir:'Kasir'};
function errMsg(e){return(e&&e.message)||'Gagal menyimpan. Periksa koneksi lalu coba lagi.'}
// owner: everything. manager: everything except users and wiping data. kasir: record new entries only.
function can(what){const r=state.role;if(r==='owner')return true;if(r==='manager')return what!=='users'&&what!=='wipe';return false}
async function api(action,body,opts){
  opts=opts||{};
  const h={'Content-Type':'application/json'};if(state.token)h['X-Auth-Token']=state.token;
  let res;
  try{res=await fetch(API+'?a='+action+(opts.qs||''),{method:body===undefined?'GET':'POST',headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'})}
  catch(e){const er=new Error('Tidak ada koneksi internet. Coba lagi.');er.offline=true;throw er}
  let j=null;try{j=await res.json()}catch(e){}
  if(!res.ok||!j||!j.ok){
    const er=new Error((j&&j.message)||'Server tidak menjawab. Coba lagi nanti.');er.server=true;er.code=j&&j.error;er.status=res.status;
    if((res.status===401&&er.code==='auth')||er.code==='disabled')signedOut(er.message);
    throw er;
  }
  return j;
}
// A copy on the phone lets the app open and record offline; changes go to the server when it is reachable.
const sync={queue:[],settings:null,cursor:0,busy:false,again:false,timer:null,err:''};
function cacheKey(){return'kasjo:v1:'+(state.me?state.me.user.id:'x')}
function saveCache(){
  try{localStorage.setItem(cacheKey(),JSON.stringify({cfg:state.cfg,trx:state.trx,kasbon:state.kasbon,closing:state.closing,product:state.product,qris:state.qris,queue:sync.queue,settings:sync.settings,cursor:sync.cursor}));localStorage.setItem('kasjo-me',JSON.stringify(state.me))}catch(e){}
}
function loadCache(){
  try{const c=JSON.parse(localStorage.getItem(cacheKey())||'null');if(!c)return false;
    state.cfg=c.cfg||null;state.trx=c.trx||[];state.kasbon=c.kasbon||[];state.closing=c.closing||[];state.product=c.product||[];state.qris=c.qris||[];sync.queue=c.queue||[];sync.settings=c.settings||null;sync.cursor=c.cursor||0;return true}catch(e){return false}
}
function sortCol(col){if(col==='trx'||col==='closing')state[col].sort((a,b)=>b.ts-a.ts)}
function upsertLocal(col,id,obj){const arr=state[col];const i=arr.findIndex(x=>x.id===id);const v=Object.assign({},obj,{id});if(i>=0)arr[i]=v;else arr.push(v);sortCol(col)}
function enqueue(rec){sync.queue=sync.queue.filter(q=>!(q.kind===rec.kind&&q.id===rec.id));sync.queue.push(rec);saveCache();updateSyncChip();flushSoon()}
async function putDoc(col,id,obj){
  const data=Object.assign({},obj);delete data.id;
  upsertLocal(col,id,data);render();
  enqueue({kind:col,id,updatedAt:Date.now(),data});
}
async function delDoc(col,id){
  state[col]=state[col].filter(x=>x.id!==id);render();
  enqueue({kind:col,id,updatedAt:Date.now(),deleted:true});
}
async function putTrx(t){const id=uid();await putDoc('trx',id,t);return Object.assign({},t,{id})}
async function saveCfg(cfg){
  state.cfg=cfg;sync.settings={data:cfg,updatedAt:Date.now()};saveCache();render();flushSoon();
}
function pendingCount(){return sync.queue.length+(sync.settings?1:0)}
function flushSoon(ms){clearTimeout(sync.timer);sync.timer=setTimeout(syncNow,ms==null?300:ms)}
async function syncNow(){
  if(!state.token)return;
  if(sync.busy){sync.again=true;return}
  sync.busy=true;
  try{
    let rejected=false;
    while(sync.queue.length||sync.settings){
      const batch=sync.queue.slice(0,300),settings=sync.settings;
      const body={records:batch};if(settings)body.settings=settings;
      const r=await api('push',body);
      const sent=new Set(batch.map(q=>q.kind+'/'+q.id+'/'+q.updatedAt));
      sync.queue=sync.queue.filter(q=>!sent.has(q.kind+'/'+q.id+'/'+q.updatedAt));
      if(sync.settings===settings)sync.settings=null;
      if((r.rejected&&r.rejected.length)||r.settings===false)rejected=true;
      saveCache();
    }
    if(rejected){sync.cursor=0;toast('Sebagian perubahan ditolak. Hanya pemilik atau manajer yang bisa mengubah atau menghapus data.')}
    await pull();
    sync.err='';
  }catch(e){
    if(e.code==='expired'){sync.err='expired';try{await pull()}catch(_){}if(state.me&&state.me.toko&&state.me.toko.active!==false){state.me.toko.active=false;render()}}
    else sync.err=e.offline?'offline':'error';
    if(state.phase==='loading'&&state.token&&e.code!=='expired'){state.slow=true;renderMain()}}
  finally{sync.busy=false;updateSyncChip();if(sync.again){sync.again=false;flushSoon(0)}}
}
async function pull(){
  const r=await api('pull',undefined,{qs:'&since='+sync.cursor});
  const pending=new Set(sync.queue.map(q=>q.kind+'/'+q.id));
  let changed=r.full||r.records.length>0;
  if(r.full){for(const c of COLS)state[c]=state[c].filter(x=>pending.has(c+'/'+x.id))}
  for(const rec of r.records){
    if(!COLS.includes(rec.kind)||pending.has(rec.kind+'/'+rec.id))continue;
    if(rec.deleted)state[rec.kind]=state[rec.kind].filter(x=>x.id!==rec.id);
    else{const arr=state[rec.kind];const i=arr.findIndex(x=>x.id===rec.id);const v=Object.assign({},rec.data,{id:rec.id});if(i>=0)arr[i]=v;else arr.push(v)}
  }
  for(const c of COLS)sortCol(c);
  if(r.settings&&!sync.settings){state.cfg=r.settings.data||null;changed=true}
  if(r.me){if(JSON.stringify(r.me)!==JSON.stringify(state.me))changed=true;state.me=r.me;state.role=r.me.user.role;if(sync.err==='expired'&&r.me.toko.active){sync.err='';if(pendingCount())flushSoon(0)}}
  sync.cursor=r.now;saveCache();
  if(state.phase!=='ready')ready();else if(changed)render();
}
function signedOut(msg){
  try{localStorage.removeItem('kasjo-token');localStorage.removeItem('kasjo-me')}catch(e){}
  state.token=null;state.me=null;state.role=null;state.phase='auth';state.cfg=null;state.trx=[];state.kasbon=[];state.closing=[];state.product=[];state.qris=[];
  sync.queue=[];sync.settings=null;sync.cursor=0;sync.err='';
  ui.sheet=null;ui.auth.pin='';ui.auth.pin2='';render();if(msg)toast(msg);
}
function signedIn(j){
  state.token=j.token;state.me=j.me;state.role=j.me.user.role;
  try{localStorage.setItem('kasjo-token',j.token);localStorage.setItem('kasjo-me',JSON.stringify(j.me))}catch(e){}
  state.cfg=null;state.trx=[];state.kasbon=[];state.closing=[];state.product=[];state.qris=[];sync.queue=[];sync.settings=null;sync.cursor=0;
  loadCache();
  ui.auth={mode:'login',phone:'',pin:'',pin2:'',toko:'',name:'',err:''};
  state.phase='loading';state.slow=false;render();syncNow();
}
function syncChip(){
  const n=pendingCount();let c='good',t='Tersimpan';
  if(sync.err==='expired'){c='bad';t=n?'Habis · '+n+' belum terkirim':'Langganan habis'}
  else if(sync.err==='offline'){c='warn';t=n?'Offline · '+n+' belum terkirim':'Offline'}
  else if(n){c='warn';t=n+' belum terkirim'}
  else if(sync.err){c='bad';t='Gagal sinkron'}
  return `<button class="pill ${c} sync" id="sync" data-act="sync-now" title="Sinkronkan sekarang">${t}</button>`;
}
function updateSyncChip(){const el=$('#sync');if(el)el.outerHTML=syncChip()}
async function guard(fn){
  if(ui.busy)return;ui.busy=true;
  try{await fn()}catch(e){toast(errMsg(e))}finally{ui.busy=false}
}

/* ---------- top & nav ---------- */
function topBar(){
  const now=new Date();
  return `<header class="top"><div class="wrap"><div class="mark">${LOGO}<span>Kas<b>Jo</b></span></div>
  <div class="biz">${state.cfg?`<div class="n">${esc(state.cfg.name)}</div>`:''}<div class="d">${HARI_L[now.getDay()]}, ${fDate(now)}</div>${syncChip()}</div>${modeBtn()}</div></header>`;
}
function navBar(route){
  const a=(r,ic,t)=>`<a href="#${r}" ${route===r?'aria-current="page"':''}>${ic}<span>${t}</span></a>`;
  return `<nav class="nav" aria-label="Menu utama"><div class="wrap">${a('beranda',I.home,'Beranda')}${a('laporan',I.report,'Laporan')}
  <a href="#catat" class="fab" ${route==='catat'?'aria-current="page"':''}><span class="k">${I.plus}</span><span>Catat</span></a>
  ${(()=>{const n=state.cfg?kbDue().filter(x=>x.k.due<=dayKey(Date.now())).length:0;return a('kasbon',I.book,'Kasbon').replace('<span>Kasbon</span>',(n?`<span class="badge" aria-label="${n} kasbon jatuh tempo">${n}</span>`:'')+'<span>Kasbon</span>')})()}${a('lainnya',I.more,'Lainnya')}</div></nav>`;
}
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
// top-right switch: record agent transactions or shop sales
function modeBtn(){const toko=ui.catMode==='toko';
  return `<button class="modebtn" data-act="mode-toggle" aria-pressed="${toko}" aria-label="${toko?'Sedang mode penjualan toko. Ketuk untuk ganti ke transaksi agen':'Sedang mode transaksi agen. Ketuk untuk ganti ke penjualan toko'}" title="${toko?'Ganti ke transaksi agen':'Ganti ke penjualan toko'}">${toko?I.shop:I.agent}<span>${toko?'Toko':'Agen'}</span></button>`}
function themeBtn(){const d=ui.theme==='dark';return `<button class="thm" data-act="theme" data-v="${d?'light':'dark'}" aria-label="${d?'Ganti ke latar putih':'Ganti ke latar gelap'}" title="${d?'Latar putih':'Latar gelap'}">${d?SUN:MOON}</button>`}
function applyTheme(t){ui.theme=t==='dark'?'dark':'light';document.documentElement.setAttribute('data-app-theme',ui.theme);try{localStorage.setItem('kasjo-theme',ui.theme)}catch(e){}}
function route(){const h=(location.hash||'').slice(1);return['beranda','catat','kasbon','laporan','lainnya'].includes(h)?h:'beranda'}

/* ---------- trx row ---------- */
const PAY_LABEL={kas:'Tunai',bank:'Transfer/QRIS',kasbon:'Kasbon'};
function itemsSummary(t){const n=t.items.reduce((a,i)=>a+Math.abs(i.qty||0),0);const first=t.items[0]?t.items[0].name:'';return (t.items.length===1?first+' ×'+Math.abs(t.items[0].qty):n+' item')+(t.kind==='jual'?' · '+(PAY_LABEL[t.pay]||'')+(t.pay==='bank'&&t.acct?' '+acctName(t.acct):''):'')}
function trxRow(t){
  const ag=AGENT[t.kind];
  let cls='neu',code='';
  if(ag){cls=ag.dir==='out'?'out':'in';code=ag.code}
  else{code={jual:'TK',stok:'BM',stokadj:'SO',modal:'MD',ambil:'AU',pindah:'PS',biaya:'BO',kasbon:'KB',bayarkasbon:'BK',selisih:'SK'}[t.kind]||'•';if(t.kind==='jual')cls='in';if(t.kind==='biaya'||(t.kind==='selisih'&&(t.d&&t.d.kas<0)))cls='bad'}
  const sub=[fTime(t.ts)+(dayKey(t.ts)!==dayKey(Date.now())?' · '+new Date(t.ts).getDate()+' '+BULAN[new Date(t.ts).getMonth()]:''),
    t.items?itemsSummary(t):ag?acctName(t.acct):(t.kind==='pindah'?acctName(t.from)+' → '+acctName(t.to):(t.acct?acctName(t.acct):'')),t.cust].filter(Boolean).join(' · ');
  let right;
  if(ag||t.kind==='jual')right=`<div class="v num">${rp(t.amount)}<div class="s pos">laba ${rp(t.profit)}</div></div>`;
  else if(t.kind==='stokadj')right=`<div class="v num">${t.items.map(i=>(i.qty>0?'+':'')+i.qty).join(', ')}</div>`;
  else if(t.kind==='biaya')right=`<div class="v num neg">${sgn(-t.amount)}</div>`;
  else if(t.kind==='selisih')right=`<div class="v num ${t.d.kas<0?'neg':'pos'}">${sgn(t.d.kas)}</div>`;
  else right=`<div class="v num">${rp(t.amount)}</div>`;
  return `<button class="r" data-act="trx" data-id="${esc(t.id)}"><span class="ic ${cls}">${code}</span><span class="main"><span class="t" style="display:block">${esc(kindLabel(t.kind))}</span><span class="s" style="display:block">${esc(sub)}</span></span>${right}</button>`;
}

/* ---------- screens ---------- */
function screenHome(){
  const bal=balances(),today=dayKey(Date.now());
  const tToday=state.trx.filter(t=>dayKey(t.ts)===today);
  const agentToday=tToday.filter(t=>AGENT[t.kind]);
  const profit=tToday.reduce((s,t)=>s+(t.profit||0),0);
  const vol=agentToday.reduce((s,t)=>s+t.amount,0);
  const pAgen=agentToday.reduce((s,t)=>s+(t.profit||0),0),sales=tToday.filter(t=>t.kind==='jual'),pToko=sales.reduce((s,t)=>s+(t.profit||0),0);
  const hasToko=state.product.length>0||sales.length>0;
  const low=lowStock(),lowB=lowBalances(bal),lowIds=new Set(lowB.map(x=>x.a.id)),due=kbDue();
  const minTxt=a=>lowIds.has(a.id)?` · <span class="lowbal">di bawah batas ${rp(a.min)}</span>`:'';
  const bk=banks(),sup=suppliers();
  const totalAset=Object.values(bal).reduce((a,b)=>a+b,0);
  const kas=bal.kas||0;
  const recent=state.trx.slice(0,8);
  return `<div class="stack">
  <section class="hero" aria-label="Ringkasan hari ini"><div class="lbl">Laba bersih hari ini</div>
  <div class="big num">${rp(profit)}</div>
  <div class="row"><span><b class="num">${agentToday.length}</b> transaksi agen</span><span>Volume <b class="num">${rp(vol)}</b></span></div>
  ${hasToko?`<div class="row"><span>Laba agen <b class="num">${rp(pAgen)}</b></span><span>Laba toko <b class="num">${rp(pToko)}</b> · ${sales.length} penjualan</span></div>`:''}</section>
  ${lowB.length?`<button class="card alert bad" data-act="sheet" data-s="mutasi"><span class="pill bad">Saldo menipis</span><span class="txt">${lowB.map(x=>`${esc(x.a.name)} ${rp(x.bal)} <span class="muted">(batas ${rp(x.a.min)})</span>`).join(' · ')}</span><span class="muted">›</span></button>`:''}
  ${due.length?`<button class="card alert warn" data-act="nav" data-r="kasbon"><span class="pill warn">Tagih kasbon</span><span class="txt">${due.length} pelanggan · ${rp(due.reduce((a,x)=>a+x.sisa,0))} jatuh tempo</span><span class="muted">›</span></button>`:''}
  ${low.length?`<button class="card" style="padding:12px 14px;display:flex;gap:10px;align-items:center;text-align:left;border-color:var(--warn);background:var(--warn-soft)" data-act="sheet" data-s="products"><span class="pill warn">Stok menipis</span><span class="small" style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(low.slice(0,4).map(p=>p.name).join(', '))}${low.length>4?' +'+(low.length-4):''}</span><span class="muted">›</span></button>`:''}
  <div class="quick">
    <button class="qk" data-act="go-catat" data-type="tarik"><span class="tile">${I.out}</span>Tarik</button>
    <button class="qk" data-act="go-catat" data-type="transfer"><span class="tile">${I.send}</span>Transfer</button>
    <button class="qk" data-act="go-catat" data-type="setor"><span class="tile">${I.dep}</span>Setor</button>
    <button class="qk" data-act="go-catat" data-type="topup"><span class="tile">${I.wallet}</span>Top Up</button>
  </div>
  <h2 class="sec">Saldo <button class="more" data-act="sheet" data-s="mutasi">Mutasi saldo</button></h2>
  <div class="card">
    <div class="bal-kas"><div><div class="lbl">Kas tunai di laci${lowIds.has('kas')?' · <span class="lowbal">di bawah batas</span>':''}</div><div class="amt num ${kas<0?'neg':lowIds.has('kas')?'lowbal':''}">${rp(kas)}</div></div>
    <button class="btn ghost" style="padding:9px 12px;font-size:13px" data-act="sheet" data-s="closing">Tutup kasir</button></div>
    <div class="rows">${bk.map(a=>`<div class="r"><span class="ic in">${esc(a.name.slice(0,3).toUpperCase())}</span><span class="main"><span class="t" style="display:block">${esc(a.name)}</span><span class="s" style="display:block">Saldo rekening / EDC${minTxt(a)}</span></span><span class="v num ${(bal[a.id]||0)<0?'neg':lowIds.has(a.id)?'lowbal':''}">${rp(bal[a.id]||0)}</span></div>`).join('')}
    ${sup.map(a=>`<div class="r"><span class="ic neu">${esc(a.name.slice(0,3).toUpperCase())}</span><span class="main"><span class="t" style="display:block">${esc(a.name)}</span><span class="s" style="display:block">Deposit supplier pulsa & token${minTxt(a)}</span></span><span class="v num ${(bal[a.id]||0)<0?'neg':lowIds.has(a.id)?'lowbal':''}">${rp(bal[a.id]||0)}</span></div>`).join('')}
    <div class="r" style="background:var(--surface-2);border-radius:0 0 var(--r) var(--r)"><span class="main"><span class="t" style="display:block">Total uang usaha</span></span><span class="v num">${rp(totalAset)}</span></div></div>
  </div>

  <h2 class="sec">Transaksi terakhir ${state.trx.length?'<button class="more" data-act="nav" data-r="laporan">Lihat semua</button>':''}</h2>
  <div class="card rows">${recent.length?recent.map(trxRow).join(''):`<div class="empty"><b>Belum ada transaksi</b>Ketuk Catat di bawah untuk mencatat tarik tunai atau transfer pertama.</div>`}</div>
  </div>`;

function chart7(){
  const days=[];const base=startOfDay(Date.now());
  for(let i=6;i>=0;i--){const d=new Date(base);d.setDate(d.getDate()-i);days.push({k:dayKey(d.getTime()),d,v:0})}
  const map={};days.forEach(x=>map[x.k]=x);
  for(const t of state.trx){const x=map[dayKey(t.ts)];if(x)x.v+=t.profit||0}
  const max=Math.max(1,...days.map(x=>x.v));
  const W=320,H=140,top=22,bot=24,bw=28,gap=(W-bw*7)/7;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik laba harian 7 hari">`;
  for(let g=0;g<=2;g++){const y=top+(H-top-bot)*g/2;s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`}
  days.forEach((x,i)=>{
    const h=Math.max(0,x.v)/max*(H-top-bot);const xx=gap/2+i*(bw+gap);const y=H-bot-h;const isT=i===6;
    s+=`<rect x="${xx}" y="${y}" width="${bw}" height="${Math.max(h,1.5)}" rx="5" fill="${isT?'var(--accent)':'var(--brand)'}" opacity="${isT?1:.85}"/>`;
    s+=`<text x="${xx+bw/2}" y="${y-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)" font-family="Roboto, sans-serif">${x.v?shortRp(x.v):''}</text>`;
    s+=`<text x="${xx+bw/2}" y="${H-7}" text-anchor="middle" font-size="11" fill="${isT?'var(--ink)':'var(--muted)'}" font-weight="${isT?700:500}" font-family="Roboto, sans-serif">${isT?'Hari ini':HARI[x.d.getDay()]}</text>`;
  });
  return s+'</svg>';
}

function compressImage(file,max,limit){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type))return rej(new Error('Pilih file gambar (JPG atau PNG).'));
  const fr=new FileReader();fr.onerror=()=>rej(new Error('Gambar tidak bisa dibaca.'));
  fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('Gambar tidak bisa dibaca. Coba file lain.'));img.onload=()=>{
    const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    let q=.85,url=c.toDataURL('image/jpeg',q);while(url.length>limit&&q>.4){q-=.1;url=c.toDataURL('image/jpeg',q)}
    url.length>limit?rej(new Error('Gambar terlalu besar.')):res(url)};img.src=fr.result};fr.readAsDataURL(file)})}

function loadQrisFile(file){
  if(!file)return;
  if(!/^image\//.test(file.type))return toast('Pilih file gambar (JPG atau PNG)');
  const fr=new FileReader();
  fr.onload=()=>{const img=new Image();img.onload=()=>{
    const max=1100,sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';x.drawImage(img,0,0,c.width,c.height);
    let q=.9,url=c.toDataURL('image/jpeg',q);while(url.length>800000&&q>.5){q-=.1;url=c.toDataURL('image/jpeg',q)}
    if(url.length>880000)return toast('Gambar terlalu besar. Coba tangkapan layar yang lebih kecil.');
    ui.qrisDraft.img=url;ui.qrisDraft.name=file.name||'';renderSheet();
  };img.onerror=()=>toast('Gambar tidak bisa dibaca. Coba file lain.');img.src=fr.result};
  fr.readAsDataURL(file);
}

const SCAN={stream:null,timer:null};
function stopScan(){if(SCAN.timer){clearInterval(SCAN.timer);SCAN.timer=null}if(SCAN.stream){SCAN.stream.getTracks().forEach(t=>t.stop());SCAN.stream=null}}

async function startScan(){
  try{
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});
    SCAN.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('#scan-video');if(!v){stopScan();return}
    v.srcObject=SCAN.stream;await v.play();
    SCAN.timer=setInterval(async()=>{try{const r=await det.detect(v);if(r&&r.length){const code=r[0].rawValue;stopScan();onScanned(code)}}catch(e){}},300);
  }catch(e){const m=$('#scan-msg');if(m)m.textContent='Kamera tidak bisa dibuka. Izinkan akses kamera, atau ketik barcode di kolom pencarian.';stopScan()}
}
function onScanned(code){
  const target=ui.scanFor;closeSheet();
  if(target==='prod'){ui.prod.barcode=code;openSheet('product');return}
  const p=state.product.find(x=>x.barcode&&String(x.barcode)===code);
  if(p){addToCart(p);ui.pos.q='';renderMain();toast(p.name+' ditambahkan')}
  else{ui.pos.q=code;renderMain();toast('Barcode '+code+' belum terdaftar di produk')}
}

function filterRtype(list){if(ui.rtype==='agen')return list.filter(t=>AGENT[t.kind]);if(ui.rtype==='toko')return list.filter(t=>TOKO_KINDS.includes(t.kind));if(ui.rtype==='lain')return list.filter(t=>!AGENT[t.kind]&&!TOKO_KINDS.includes(t.kind));return list}
function rangeBounds(r){
  const now=Date.now(),t0=startOfDay(now),D=86400000;
  const d=new Date(t0);
  switch(r){
    case'yesterday':return[t0-D,t0,'Kemarin'];
    case'7d':return[t0-6*D,t0+D,'7 hari terakhir'];
    case'month':{const s=new Date(d.getFullYear(),d.getMonth(),1).getTime();return[s,t0+D,BULAN[d.getMonth()]+' '+d.getFullYear()]}
    case'lastmonth':{const s=new Date(d.getFullYear(),d.getMonth()-1,1);const e=new Date(d.getFullYear(),d.getMonth(),1);return[s.getTime(),e.getTime(),BULAN[s.getMonth()]+' '+s.getFullYear()]}
    default:return[t0,t0+D,'Hari ini'];
  }
}
function reportData(){
  const[s,e,label]=rangeBounds(ui.range);
  const rows=state.trx.filter(t=>t.ts>=s&&t.ts<e);
  const byType={};let fee=0,cost=0,biaya=0,vol=0,cnt=0,selisih=0,profit=0,pAgen=0,omzet=0,pToko=0,nJual=0;const top={};
  for(const t of rows){
    profit+=t.profit||0;
    if(AGENT[t.kind]){const b=byType[t.kind]||(byType[t.kind]={n:0,vol:0,fee:0});b.n++;b.vol+=t.amount;b.fee+=t.fee||0;fee+=t.fee||0;cost+=t.cost||0;vol+=t.amount;cnt++;pAgen+=t.profit||0}
    else if(t.kind==='jual'){omzet+=t.amount;pToko+=t.profit||0;nJual++;for(const it of t.items){const x=top[it.name]||(top[it.name]={qty:0,omzet:0,laba:0});x.qty+=it.qty;x.omzet+=it.qty*it.price;x.laba+=it.qty*(it.price-(it.cost||0))}}
    else if(t.kind==='biaya')biaya+=t.amount;
    else if(t.kind==='selisih')selisih+=(t.d&&t.d.kas)||0;
  }
  const days={};
  for(const t of rows){const k=dayKey(t.ts);const x=days[k]||(days[k]={n:0,fee:0,profit:0});if(AGENT[t.kind]){x.n++;x.fee+=t.fee||0}x.profit+=t.profit||0}
  const topList=Object.entries(top).map(([name,x])=>Object.assign({name},x)).sort((a,b)=>b.omzet-a.omzet).slice(0,10);
  return{s,e,label,rows,byType,fee,cost,biaya,vol,cnt,selisih,profit,days,pAgen,omzet,pToko,nJual,topList};
}

/* ---------- printer struk (ESC/POS) ---------- */
// Two ways to print: straight from the browser over Bluetooth (BLE printers, Chrome on Android or laptop),
// or by handing the receipt to the free RawBT app, which talks to almost any Bluetooth thermal printer.
const PRN={dev:null,char:null,busy:false};
const BLE_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ffe0-0000-1000-8000-00805f9b34fb','0000ff00-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb','0000ae00-0000-1000-8000-00805f9b34fb'];
function prnCfg(){let c={};try{c=JSON.parse(localStorage.getItem('kasjo-printer')||'{}')||{}}catch(e){}return Object.assign({mode:navigator.bluetooth?'ble':'rawbt',width:32,auto:false,footer:'Terima kasih',name:''},c)}
function savePrnCfg(c){try{localStorage.setItem('kasjo-printer',JSON.stringify(c))}catch(e){}}
function ascii(s){return String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[^\x20-\x7e]/g,'')}
function wrapText(s,w){const out=[];let line='';for(const word of ascii(s).split(/\s+/).filter(Boolean)){let wd=word;while(wd.length>w){if(line){out.push(line);line=''}out.push(wd.slice(0,w));wd=wd.slice(w)}if(!line)line=wd;else if(line.length+1+wd.length<=w)line+=' '+wd;else{out.push(line);line=wd}}if(line)out.push(line);return out.length?out:['']}
function twoCol(a,b,w){a=ascii(a);b=ascii(b);if(a.length+1+b.length<=w)return[a+' '.repeat(w-a.length-b.length)+b];return[a,' '.repeat(Math.max(0,w-b.length))+b.slice(-w)]}
// receipt as lines: {t:text, c:center, b:bold, big:double size}
function receiptLines(t,w){
  const P=prnCfg(),L=[],dash='-'.repeat(w);
  const add=(text,o)=>L.push(Object.assign({t:text},o||{}));
  for(const x of wrapText((state.cfg&&state.cfg.name)||'Kasjo',w>=48?24:16))add(x,{c:1,b:1,big:1});
  add('Struk Transaksi',{c:1});add(fDate(t.ts)+' '+fTime(t.ts),{c:1});add(dash);
  add(ascii(kindLabel(t.kind).toUpperCase()),{c:1,b:1});add('');
  const row=(a,b,o)=>twoCol(a,b,w).forEach(x=>add(x,o));
  if(t.kind==='jual'){
    for(const it of t.items){wrapText(it.name,w).forEach(x=>add(x));row('  '+it.qty+' x '+fmt(it.price),rp(it.qty*it.price))}
    add(dash);row('TOTAL',rp(t.amount),{b:1});

function escpos(lines){
  const b=[0x1b,0x40,0x1b,0x74,0x00];
  for(const l of lines){
    b.push(0x1b,0x61,l.c?1:0,0x1b,0x45,l.b?1:0,0x1d,0x21,l.big?0x11:0x00);
    for(const ch of l.t)b.push(ch.charCodeAt(0)&0x7f);
    b.push(0x0a);
  }
  b.push(0x1b,0x61,0,0x1b,0x45,0,0x1d,0x21,0,0x1b,0x64,0x04,0x1d,0x56,0x42,0x00);
  return new Uint8Array(b);
}

async function bleConnect(pick){
  if(!navigator.bluetooth)throw prnErr('Browser ini belum bisa Bluetooth langsung. Pakai Chrome di Android atau laptop, atau pilih mode "Lewat aplikasi RawBT".');
  if(PRN.char&&PRN.dev&&PRN.dev.gatt.connected&&!pick)return PRN.char;
  let dev=pick?null:PRN.dev;
  if(!dev&&!pick&&navigator.bluetooth.getDevices){try{const P=prnCfg();const list=await navigator.bluetooth.getDevices();dev=list.find(d=>d.id===P.id)||null}catch(e){}}
  if(!dev)dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:BLE_SERVICES});
  const server=await dev.gatt.connect();
  let services=[];try{services=await server.getPrimaryServices()}catch(e){}
  for(const sv of services){let chars=[];try{chars=await sv.getCharacteristics()}catch(e){continue}
    for(const c of chars){if(c.properties.write||c.properties.writeWithoutResponse){
      PRN.dev=dev;PRN.char=c;
      if(!dev._kasjo){dev._kasjo=1;dev.addEventListener('gattserverdisconnected',()=>{PRN.char=null;if(ui.sheet&&ui.sheet.type==='printer')renderSheet()})}
      const P=prnCfg();P.name=dev.name||'Printer Bluetooth';P.id=dev.id;savePrnCfg(P);return c}}}
  try{dev.gatt.disconnect()}catch(e){}
  throw prnErr('Printer tersambung tetapi tidak menerima data. Printer ini kemungkinan Bluetooth Classic: pilih mode "Lewat aplikasi RawBT".');
}
async function bleWrite(c,bytes){
  const fast=c.properties.writeWithoutResponse&&c.writeValueWithoutResponse;
  for(let i=0;i<bytes.length;i+=20){const part=bytes.slice(i,i+20);if(fast){await c.writeValueWithoutResponse(part);await sleep(12)}else await c.writeValue(part)}
}
function rawbtSend(bytes){
  let bin='';for(const x of bytes)bin+=String.fromCharCode(x);
  location.href='intent:base64,'+btoa(bin)+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
}
async function printBytes(bytes,pick){
  const P=prnCfg();
  if(P.mode==='rawbt'){rawbtSend(bytes);return'rawbt'}
  if(PRN.busy)return;PRN.busy=true;
  try{const c=await bleConnect(pick);await bleWrite(c,bytes);return'ble'}
  finally{PRN.busy=false}
}

function renderSheet(){

    case'mutasi':h=sheetMutasi();break;
    case'kbnew':h=sheetKbNew();break;
    case'kbdetail':h=sheetKbDetail(s.id);break;

    case'stockin':h=sheetStockIn();break;
    case'stockadj':h=sheetStockAdj();break;
    case'scan':h=sheetScan();break;
    case'qrisSet':h=sheetQrisSet();break;

function renderWithFocus(fn){
  const a=document.activeElement;const id=a&&a.id;let ss=null,se=null;
  try{ss=a.selectionStart;se=a.selectionEnd}catch(e){}
  fn();
  if(id){const n=document.getElementById(id);if(n&&n!==document.activeElement){n.focus({preventScroll:true});try{if(ss!=null)n.setSelectionRange(ss,se)}catch(e){}}}
}
function render(){renderWithFocus(()=>{renderMain();renderSheet()})}

/* ---------- input handling ---------- */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.money){
    const v=digits(el.value);setPath(el.dataset.money,v);
    el.value=v?fmt(v):'';
    try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}
    if(el.dataset.money==='form.amount'&&ui.form.feeAuto){ui.form.fee=feeFor(ui.form.type,v);const fe=$('#f-fee');if(fe)fe.value=fmt(ui.form.fee)}
    if(el.dataset.money==='form.fee'){if(ui.form.feeAuto){ui.form.feeAuto=false;renderWithFocus(renderMain);return}}
    if(el.dataset.money.startsWith('form.')){const p=$('#catat-preview');if(p)p.innerHTML=catatPreview()}
    if(el.dataset.money==='close.direct')updateCloseVerdict();
    if(el.dataset.money==='pos.given')renderWithFocus(renderMain);
    if(el.dataset.money==='stockF.cost'){const ef=document.querySelector('.sheet .effect b');if(ef)ef.textContent=rp(digits(ui.stockF.qty)*(ui.stockF.cost||0))}
    return;
  }
  if(el.dataset.text){
    setPath(el.dataset.text,el.value);
    if(el.dataset.text.startsWith('poster.'))schedulePoster(350);
    if(el.dataset.text==='pos.q')renderWithFocus(renderMain);
    if(el.dataset.text==='stockF.pid'){const p=state.product.find(x=>x.id===el.value);if(p)ui.stockF.cost=p.cost||0;renderWithFocus(renderSheet)}
    if(el.dataset.text==='stockF.qty'){const ef=document.querySelector('.sheet .effect b');if(ef)ef.textContent=rp(digits(ui.stockF.qty)*(ui.stockF.cost||0))}
    if(el.dataset.text==='q'){const R=reportData();let list=R.rows;
      list=filterRtype(list);
      const q=ui.q.toLowerCase();if(q)list=list.filter(t=>[kindLabel(t.kind),t.cust,t.note,acctName(t.acct),String(t.amount),(t.items||[]).map(i=>i.name).join(' ')].join(' ').toLowerCase().includes(q));
      $('#r-list').innerHTML=list.length?list.slice(0,300).map(trxRow).join(''):'<div class="empty"><b>Tidak ada transaksi</b>Coba kata kunci lain.</div>'}
    return;
  }
  if(el.dataset.minbal){const v=digits(el.value);ui.minDraft[el.dataset.minbal]=v;el.value=v?fmt(v):'';try{el.setSelectionRange(el.value.length,el.value.length)}catch(_){}return}
  if(el.dataset.prn){const P=prnCfg();P[el.dataset.prn]=el.value;savePrnCfg(P);return}
  if(el.dataset.count){
    const d=+el.dataset.count;const v=digits(el.value);ui.close.counts[d]=v;el.value=v||'';
    const s=$('#dns-'+d);if(s)s.textContent=v?fmt(d*v):'–';updateCloseVerdict();return;
  }
  if(el.dataset.tier!=null){
    const i=+el.dataset.tier,k=el.dataset.k;const raw=el.value.replace(/\D/g,'');
    ui.fees[ui.feeType][i][k]=k==='upTo'&&!raw?null:digits(raw);el.value=raw?fmt(digits(raw)):'';
  }
});
function updateCloseVerdict(){
  const c=ui.close,expected=balances().kas||0;
  const actual=c.mode==='count'?DENOMS.reduce((s,d)=>s+d*(c.counts[d]||0),0):c.direct;
  const diff=actual-expected;
  const v=!actual?null:diff===0?['good','Pas, tidak ada selisih','']:diff>0?['warn','Uang lebih',sgn(diff)]:['bad','Uang kurang',sgn(diff)];
  const el=$('#close-verdict');if(el)el.innerHTML=closeVerdict(actual,v);
  const b=document.querySelector('[data-act="close-save"]');if(b)b.disabled=!(actual&&state.canWrite);
}

async function addAccount(n,kind){
  const cfg=clone(state.cfg);let id=slug(n);if(cfg.accounts.some(a=>a.id===id))id=id+'-'+uid().slice(-4);
  cfg.accounts.push({id,name:n,kind:kind||'bank'});await saveCfg(cfg);toast(n+' ditambahkan');return id;
}
function copyText(txt,node,msg){
  const done=()=>toast(msg||'Struk disalin');
  try{navigator.clipboard.writeText(txt).then(done,()=>sel())}catch(e){sel()}
  function sel(){if(!node)return;const r=document.createRange();r.selectNodeContents(node);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Teks dipilih, tekan salin')}
}
function randomPin(){const weak=['123456','654321','123123','112233','121212'];let p;do{const a=new Uint32Array(1);crypto.getRandomValues(a);p=String(a[0]%1000000).padStart(6,'0')}while(/^(\d)\1{5}$/.test(p)||weak.includes(p));return p}

async function exportCsv(){
  const R=reportData();
  const head=['Tanggal','Jam','Jenis','Rekening','Nominal','Fee','Biaya bank','Laba','Kas tunai','Pelanggan','Item','Catatan'];
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=R.rows.slice().reverse().map(t=>[dayKey(t.ts),fTime(t.ts),kindLabel(t.kind),t.kind==='pindah'?acctName(t.from)+' > '+acctName(t.to):(t.acct?acctName(t.acct):''),t.amount||0,t.fee||0,AGENT[t.kind]?t.cost||0:0,t.profit||0,(t.d&&t.d.kas)||0,t.cust||'',(t.items||[]).map(i=>i.qty+'x '+i.name).join(', '),t.note||''].map(q).join(';'));
  const csv='sep=;\n'+head.map(q).join(';')+'\n'+rows.join('\n');
  const name='Kasjo-'+R.label.replace(/\s+/g,'-')+'.csv';
  try{saveFile(name,new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));toast('Laporan diunduh')}catch(e){toast('Gagal mengunduh laporan')}
}

async function loadDemo(){
  const accounts=[{id:'kas',name:'Kas Tunai',kind:'cash'},{id:'bri',name:'BRI',kind:'bank'},{id:'bni',name:'BNI',kind:'bank'},{id:'mandiri',name:'Mandiri',kind:'bank'},{id:'supplier',name:'Supplier PPOB',kind:'supplier'}];
  await saveCfg({name:'Agen Contoh (data contoh)',accounts,fees:DEFAULT_FEES,createdAt:Date.now(),demo:true});
  const list=[];const D=86400000,t0=startOfDay(Date.now());
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const first=t0-6*D+7*3600000;
  list.push({ts:first,kind:'modal',acct:'kas',amount:15000000,d:{kas:15000000},profit:0,note:'Modal awal (contoh)',cust:''});
  list.push({ts:first+1000,kind:'modal',acct:'bri',amount:20000000,d:{bri:20000000},profit:0,note:'Modal awal (contoh)',cust:''});
  list.push({ts:first+2000,kind:'modal',acct:'bni',amount:8000000,d:{bni:8000000},profit:0,note:'Modal awal (contoh)',cust:''});
  list.push({ts:first+3000,kind:'modal',acct:'mandiri',amount:5000000,d:{mandiri:5000000},profit:0,note:'Modal awal (contoh)',cust:''});
  const names=['Pak Joko','Bu Rina','Mas Andi','Siti','','','','Pak Haji Umar','Dewi',''];
  const types=['tarik','tarik','tarik','transfer','transfer','setor','topup','tagihan','tarik','transfer'];
  const amts=[100000,200000,300000,500000,500000,1000000,1500000,2000000,250000,750000];
  const now=Date.now();
  for(let day=6;day>=0;day--){
    const n=day===0?7:5+Math.floor(rnd()*5);
    for(let i=0;i<n;i++){
      const ts=t0-day*D+(8+Math.floor(rnd()*12))*3600000+Math.floor(rnd()*3600000);if(ts>now)continue;
      const type=types[Math.floor(rnd()*types.length)];
      const amount=type==='tagihan'?[87500,152000,245000][Math.floor(rnd()*3)]:type==='topup'?[50000,100000,200000][Math.floor(rnd()*3)]:amts[Math.floor(rnd()*amts.length)];
      const acct=['bri','bri','bri','bni','mandiri'][Math.floor(rnd()*5)];
      const fee=feeFor(type,amount);const cost=type==='transfer'&&acct!=='bri'&&rnd()<.4?2500:0;
      const f={type,acct,amount,fee,feeTo:'kas',cost};
      list.push({ts,kind:type,acct,amount,fee,feeTo:'kas',cost,d:agentEffect(f),profit:fee-cost,cust:names[Math.floor(rnd()*names.length)],note:'contoh'});
    }
    if(day===3)list.push({ts:t0-day*D+19*3600000,kind:'biaya',acct:'kas',amount:45000,d:{kas:-45000},profit:-45000,note:'Kertas struk 5 roll (contoh)',cust:''});
  }
  // shop (contoh): products, opening stock, deposit, a few sales
  const prods=[['Pulsa 10.000 (contoh)','pulsa',1,12000,10400],['Pulsa 25.000 (contoh)','pulsa',1,27000,25150],['Token PLN 50.000 (contoh)','token',1,52500,50300],['Gula pasir 1 kg (contoh)','sembako',0,18000,15500],['Minyak goreng 1 L (contoh)','sembako',0,19000,16800],['Air mineral 600 ml (contoh)','minuman',0,4000,2600]];
  const pid=[];for(const [name,cat,dig,price,cost] of prods){const id=uid();pid.push({id,name,dig,price,cost});await putDoc('product',id,{name,cat,digital:!!dig,price,cost,sup:dig?'supplier':null,min:dig?null:3,barcode:'',ts:first})}
  list.push({ts:first+4000,kind:'modal',acct:'supplier',amount:1000000,d:{supplier:1000000},profit:0,note:'Deposit awal (contoh)',cust:''});
  for(const x of pid.filter(x=>!x.dig))list.push({ts:first+5000,kind:'stok',items:[{pid:x.id,name:x.name,qty:12,cost:x.cost}],amount:0,acct:null,d:{},profit:0,cust:'',note:'Stok awal'});
  for(let day=5;day>=0;day--){for(let i=0;i<3;i++){const x=pid[Math.floor(rnd()*pid.length)];const qty=x.dig?1:1+Math.floor(rnd()*2);const ts=t0-day*D+(9+i*3)*3600000;if(ts>now)continue;
    const d={kas:qty*x.price};if(x.dig)d.supplier=-qty*x.cost;
    list.push({ts,kind:'jual',items:[{pid:x.id,name:x.name,qty,price:x.price,cost:x.cost,sup:x.dig?'supplier':null}],amount:qty*x.price,itemCost:qty*x.cost,profit:qty*(x.price-x.cost),pay:'kas',acct:'kas',given:qty*x.price,ref:null,cust:'',d,note:''})}}
  for(const t of list)await putTrx(t);
  const k1=uid(),k2=uid();

function initPoster(fees){
  const types={};for(const k in AGENT)types[k]=!!(fees[k]&&fees[k].some(t=>t.fee>0));
  ui.poster={fees:clone(fees),title:(state.cfg&&state.cfg.name)||'Agen saya',sub:'Layanan Agen Bank & Mini ATM',note:'',types};
}
function rangeRows(tiers){
  const s=tiers.slice().sort((a,b)=>(a.upTo==null?Infinity:a.upTo)-(b.upTo==null?Infinity:b.upTo));
  let prev=0;
  return s.map((t,i)=>{let r;
    if(t.upTo==null)r=prev?'Di atas '+fmt(prev):'Semua nominal';
    else if(i===0)r='s/d '+fmt(t.upTo);
    else r=fmt(prev+1)+'  –  '+fmt(t.upTo);
    if(t.upTo!=null)prev=t.upTo;return{r,fee:t.fee||0}});
}

let posterT;
function schedulePoster(ms){clearTimeout(posterT);posterT=setTimeout(async()=>{const img=$('#poster-img');if(!img)return;const c=await drawPoster();img.src=c.toDataURL('image/jpeg',.85)},ms)}
function rr(ctx,x,y,w,h,r){r=Math.min(r,h/2,w/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function fitText(ctx,text,maxW,size,weight,family){let s=size;do{ctx.font=weight+' '+s+'px '+family;if(ctx.measureText(text).width<=maxW)break;s-=2}while(s>12);return s}
let logoImg=null;
function getLogo(){return new Promise(res=>{if(logoImg)return res(logoImg);const m=LOGO.match(/src="([^"]+)"/);const im=new Image();im.onload=()=>{logoImg=im;res(im)};im.onerror=()=>res(null);im.src=m?m[1]:''})}
async function drawPoster(){
  try{await Promise.all([document.fonts.load('700 40px Poppins'),document.fonts.load('500 30px Roboto'),document.fonts.load('700 30px Roboto')])}catch(e){}
  const P=ui.poster,W=1240,H=1754,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const TEAL='#0e7c73',TEAL2='#14a093',DEEP='#0b5654',ORANGE='#f6822a',ORANGE2='#f9a63a',SOFT='#e9f5f3',INK='#1d2a29',MUTED='#5f706e';
  const PP='Poppins, Roboto, sans-serif',RB='Roboto, sans-serif';
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  // header
  const g=x.createLinearGradient(0,0,W,380);g.addColorStop(0,DEEP);g.addColorStop(1,TEAL2);
  x.fillStyle=g;x.beginPath();x.moveTo(0,0);x.lineTo(W,0);x.lineTo(W,330);x.quadraticCurveTo(W/2,410,0,330);x.closePath();x.fill();
  x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.arc(W-90,40,190,0,Math.PI*2);x.fill();
  const logo=await getLogo();
  x.textBaseline='middle';
  if(logo)x.drawImage(logo,60,44,56,56);
  x.font='700 30px '+PP;x.textAlign='left';x.fillStyle='#fff';x.fillText('Kas',128,74);const bw=x.measureText('Kas').width;x.fillStyle=ORANGE2;x.fillText('jo',128+bw,74);
  x.textAlign='center';x.fillStyle='#fff';
  const title=(P.title||'').trim()||'Agen saya';
  fitText(x,title,W-140,76,'700',PP);x.fillText(title,W/2,176);
  if(P.sub){fitText(x,P.sub,W-200,32,'500',RB);x.fillStyle='rgba(255,255,255,.88)';x.fillText(P.sub,W/2,236)}
  x.font='700 38px '+PP;const pt='BIAYA ADMIN TRANSAKSI';const pw=x.measureText(pt).width+90;
  const og=x.createLinearGradient(W/2-pw/2,0,W/2+pw/2,0);og.addColorStop(0,ORANGE2);og.addColorStop(1,ORANGE);
  x.fillStyle=og;rr(x,W/2-pw/2,276,pw,70,35);x.fill();x.fillStyle='#fff';x.fillText(pt,W/2,312);
  // body
  const secs=Object.keys(AGENT).filter(k=>P.types[k]&&P.fees[k]&&P.fees[k].length).map(k=>({k,rows:rangeRows(P.fees[k])}));
  const top=420,bottom=H-(P.note?190:150),L=70,R=W-70;
  const units=secs.reduce((a,s)=>a+1.15+s.rows.length+0.45,0)||1;
  const u=Math.min(84,(bottom-top)/units);
  let y=top+Math.max(0,((bottom-top)-units*u)/2);
  if(!secs.length){x.fillStyle=MUTED;x.font='500 34px '+RB;x.fillText('Pilih minimal satu jenis transaksi',W/2,(top+bottom)/2)}
  const split=L+(R-L)*0.66;
  for(const s of secs){
    const hh=u*0.92;
    const sg=x.createLinearGradient(L,0,split,0);sg.addColorStop(0,ORANGE);sg.addColorStop(1,ORANGE2);
    x.fillStyle=sg;rr(x,L,y,split-L-12,hh,hh/2);x.fill();
    x.fillStyle='#fff';fitText(x,AGENT[s.k].label.toUpperCase(),split-L-60,Math.round(u*0.42),'700',PP);x.fillText(AGENT[s.k].label.toUpperCase(),(L+split-12)/2,y+hh/2+1);
    x.fillStyle=TEAL;rr(x,split,y,R-split,hh,hh/2);x.fill();
    x.fillStyle='#fff';x.font='700 '+Math.round(u*0.4)+'px '+PP;x.fillText('ADMIN',(split+R)/2,y+hh/2+1);
    y+=u*1.15;
    s.rows.forEach((r,i)=>{
      const h=u*0.8,cy=y+h/2;
      x.fillStyle=SOFT;rr(x,L,y,R-L,h,h/2);x.fill();
      x.fillStyle=ORANGE;x.beginPath();x.arc(L+h/2,cy,h*0.42,0,Math.PI*2);x.fill();
      x.fillStyle='#fff';x.font='700 '+Math.round(h*0.42)+'px '+RB;x.fillText(String(i+1),L+h/2,cy+1);
      x.textAlign='left';x.fillStyle=INK;fitText(x,r.r,split-(L+h+30)-20,Math.round(h*0.46),'500',RB);x.fillText(r.r,L+h+30,cy+1);
      x.fillStyle=TEAL;x.beginPath();x.arc(split+h*0.6,cy,h*0.4,0,Math.PI*2);x.fill();
      x.textAlign='center';x.fillStyle='#fff';x.font='700 '+Math.round(h*0.3)+'px '+RB;x.fillText('Rp',split+h*0.6,cy+1);
      x.textAlign='left';x.fillStyle=DEEP;x.font='700 '+Math.round(h*0.5)+'px '+PP;x.fillText(fmt(r.fee),split+h*1.25,cy+2);
      x.textAlign='center';y+=u;
    });
    y+=u*0.45;
  }
  // footer
  let fy=H-120;
  if(P.note){x.fillStyle=INK;fitText(x,P.note,W-160,32,'500',RB);x.fillText(P.note,W/2,H-150);}
  x.fillStyle=MUTED;x.font='400 22px '+RB;x.fillText('Harga dapat berubah sewaktu-waktu · Dibuat dengan Kasjo',W/2,H-96);
  const fg=x.createLinearGradient(0,0,W,0);fg.addColorStop(0,DEEP);fg.addColorStop(1,TEAL2);x.fillStyle=fg;x.fillRect(0,H-48,W,48);
  x.fillStyle=ORANGE;x.fillRect(0,H-56,W,8);
  return c;
}
async function posterDownload(kind){
  if(ui.busy)return;ui.busy=true;
  try{
    const c=await drawPoster();const base='Tabel-Fee-'+(ui.poster.title||'Agen').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
    let data,filename;
    if(kind==='pdf'){
      await loadJsPDF();
      const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
      doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,210,297);
      data=doc.output('blob');filename=base+'.pdf';
    }else{data=await new Promise(r=>c.toBlob(r,'image/png'));filename=base+'.png'}
    saveFile(filename,data);toast('Poster diunduh, siap dicetak');
  }catch(e){toast(e&&e.message==='jspdf'?'PDF belum bisa dibuat. Coba unduh PNG.':'Gagal mengunduh poster')}
  finally{ui.busy=false}
}
function loadJsPDF(){return new Promise((res,rej)=>{if(window.jspdf)return res();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';sc.onload=()=>window.jspdf?res():rej(new Error('jspdf'));sc.onerror=()=>rej(new Error('jspdf'));document.head.appendChild(sc)})}
