<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Template feed: tanpa foto, screenshot aplikasi</title>
<link rel="stylesheet" href="../brand.css">
</head>
<body>
<!-- FEED 1080x1350 tanpa foto orang: latar warna brand + burst + layar KasJo asli. -->
<div class="canvas feed" style="background:#3FB6AA">
  <div class="abs burst-b" style="left:90px;top:260px;width:900px;height:900px;background:var(--yellow)"></div>
  <div class="brand"><img src="../photos/kasjo-icon.png" alt=""><span><span class="kas">Kas</span><span class="jo">Jo</span></span></div>
  <div class="abs center" style="left:0;top:150px;width:1080px">
    <span style="font-size:40px;font-weight:800;color:#fff">Tutup toko, hitung laci...</span>
    <span class="chunky c-white tilt-l" style="font-size:134px">Kok Selisih?!</span>
  </div>
  <img class="abs phone" src="../photos/app-1-beranda.png" alt="" style="left:370px;top:470px;width:340px;transform:rotate(6deg)">
  <div class="abs coin" style="left:150px;top:600px;width:110px;height:110px"></div>
  <div class="abs burst-a center" style="left:60px;top:1030px;width:960px;height:300px;background:var(--orange)">
    <span style="font-size:30px;font-weight:800">Pakai KasJo,</span>
    <span class="chunky sm c-yellow" style="font-size:112px">GAK LAGI!</span>
  </div>
</div>
</body>
</html>
