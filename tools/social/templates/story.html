<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Template story 1080x1920</title>
<link rel="stylesheet" href="../brand.css">
</head>
<body>
<!-- STORY 1080x1920. Zona aman: jangan taruh teks penting di 250px atas dan 300px bawah (UI Instagram).
     Story tidak punya caption: semua pesan + ajakan harus ada di gambar. -->
<div class="canvas story" style="background:#0B4F4C">
  <img class="abs" src="../photos/agen-teriak-senang-koin.jpg" alt="" style="left:0;top:0;width:1080px;height:1340px;object-fit:cover;object-position:center top">
  <div class="brand" style="top:270px"><img src="../photos/kasjo-icon.png" alt=""><span><span class="kas">Kas</span><span class="jo">Jo</span></span></div>
  <div class="abs burst-c" style="left:-80px;top:1180px;width:1240px;height:560px;background:var(--yellow)"></div>
  <div class="abs center" style="left:0;top:1260px;width:1080px">
    <span class="label">Untung hari ini berapa?</span>
    <span class="chunky c-white tilt-l" style="font-size:150px;margin-top:18px">KELIHATAN!</span>
    <span class="chip" style="margin-top:34px;font-size:36px">Coba gratis 30 hari · kasjo.site</span>
  </div>
</div>
</body>
</html>
