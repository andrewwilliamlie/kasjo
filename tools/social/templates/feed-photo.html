<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Template feed: foto penuh</title>
<link rel="stylesheet" href="../brand.css">
</head>
<body>
<!-- FEED 1080x1350, foto penuh. Ganti foto, label, headline, burst & CTA. Jaga wajah tetap terlihat. -->
<div class="canvas feed" style="background:#FFC21F">
  <img class="photo" src="../photos/agen-teriak-senang-koin.jpg" alt="">
  <div class="brand"><img src="../photos/kasjo-icon.png" alt=""><span><span class="kas">Kas</span><span class="jo">Jo</span></span></div>
  <div class="abs bubble" style="right:30px;top:60px;width:320px;font-size:32px;transform:rotate(5deg)">Untung hari ini berapa, ya?</div>
  <div class="abs center" style="left:0;top:960px;width:1080px">
    <span class="label yellow">Buka KasJo, laba langsung...</span>
    <span class="chunky c-white tilt-l" style="font-size:170px;margin-top:18px">KELIHATAN!</span>
  </div>
  <div class="cta-bar" style="top:1250px;height:100px"><span class="txt">Gratis 30 hari</span><span class="chip yellow">kasjo.site</span></div>
</div>
</body>
</html>
